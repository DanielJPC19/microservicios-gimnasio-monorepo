$kind: http-request
url: "{{api_url}}/equipos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Cinta de correr",
      "descripcion": "Equipo cardiovascular",
      "cantidad": 5
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
