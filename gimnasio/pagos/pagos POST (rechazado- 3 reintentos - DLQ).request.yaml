$kind: http-request
name: "pagos POST (rechazado: 3 reintentos -> DLQ)"
url: "{{api_url}}/pagos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "miembroId": 1,
      "monto": 120000,
      "metodoPago": "TARJETA_RECHAZADA"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 202 Accepted", function () { pm.response.to.have.status(202); });
    language: text/javascript
order: 4000
