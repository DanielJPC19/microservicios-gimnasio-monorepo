$kind: http-request
url: "{{api_url}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response body is API is working", function () { pm.expect(pm.response.text()).to.include("API is working"); });
    language: text/javascript
order: 8000
