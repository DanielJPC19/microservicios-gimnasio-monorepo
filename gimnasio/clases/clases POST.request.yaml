$kind: http-request
url: "{{api_url}}/clases"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Yoga",
      "horario": { "horario": "2026-09-01T10:00:00" },
      "capacidad": { "capacidad": 20 },
      "entrenadorId": 1
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
