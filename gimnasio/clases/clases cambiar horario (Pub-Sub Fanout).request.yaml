$kind: http-request
url: "{{api_url}}/clases/1/horario"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nuevoHorario": "2026-09-28T18:30:00",
      "motivo": "Cambio de salón principal por mantenimiento"
    }
scripts:
