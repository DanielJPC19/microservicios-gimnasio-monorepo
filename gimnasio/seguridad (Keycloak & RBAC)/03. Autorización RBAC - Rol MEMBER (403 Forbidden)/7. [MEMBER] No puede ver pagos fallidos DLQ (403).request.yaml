$kind: http-request
url: "{{api_url}}/pagos/fallidos"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{member_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("MEMBER no autorizado a ver pagos fallidos -> 403 Forbidden", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 7000
