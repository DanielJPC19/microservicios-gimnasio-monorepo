$kind: http-request
url: "{{api_url}}/equipos/1/reportar-averia"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "motivo": "Avería intento miembro",
      "gravedad": "MEDIA"
    }
auth:
  type: bearer
  credentials:
    token: "{{member_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("MEMBER no autorizado a reportar avería -> 403 Forbidden", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 5000
