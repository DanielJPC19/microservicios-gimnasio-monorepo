$kind: http-request
url: "{{api_url}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK para ruta pública", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Cuerpo contiene API is working", function () {
          pm.expect(pm.response.text()).to.include("API is working");
      });
    language: text/javascript
order: 3000
