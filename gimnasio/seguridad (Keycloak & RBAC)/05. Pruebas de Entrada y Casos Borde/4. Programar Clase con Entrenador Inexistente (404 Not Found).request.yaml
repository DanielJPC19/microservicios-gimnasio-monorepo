$kind: http-request
url: "{{api_url}}/clases"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Clase Sin Entrenador",
      "horario": "2026-09-01T10:00:00",
      "capacidad": 20,
      "entrenadorId": 999
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Programar clase con entrenadorId inexistente -> 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 4000
