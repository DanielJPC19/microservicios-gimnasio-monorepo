$kind: http-request
url: "{{api_url}}/miembros"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Miembro Email Invalido",
      "email": "correo-sin-arroba",
      "fechaInscripcion": "2026-09-01"
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Email sin formato válido viola invariante de VO Email -> 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 6000
