$kind: http-request
url: "{{api_url}}/clases"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Yoga Capacidad Negativa",
      "horario": "2026-09-01T10:00:00",
      "capacidad": -5,
      "entrenadorId": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Capacidad <= 0 viola invariante de VO Capacidad -> 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 5000
