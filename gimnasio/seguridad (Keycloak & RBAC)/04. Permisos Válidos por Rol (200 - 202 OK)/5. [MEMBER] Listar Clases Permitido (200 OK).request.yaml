$kind: http-request
url: "{{api_url}}/clases"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{member_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("MEMBER accede a listar clases -> 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
