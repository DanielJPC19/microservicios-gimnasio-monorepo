$kind: http-request
url: "{{api_url}}/pagos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "miembroId": 1,
      "monto": 120000,
      "metodoPago": "TARJETA"
    }
auth:
  type: bearer
  credentials:
    token: "{{member_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("MEMBER puede solicitar pago -> 202 Accepted", function () {
          pm.response.to.have.status(202);
      });
    language: text/javascript
order: 6000
