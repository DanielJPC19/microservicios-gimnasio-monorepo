$kind: http-request
url: "{{api_url}}/equipos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Mancuernas 10kg",
      "descripcion": "Pesas",
      "cantidad": 10
    }
auth:
  type: bearer
  credentials:
    token: "{{trainer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("TRAINER no autorizado a crear equipo -> 403 Forbidden", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 2000
