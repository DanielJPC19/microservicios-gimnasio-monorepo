$kind: http-request
url: "{{api_url}}/entrenadores"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Carlos Ruiz",
      "especialidad": "Cardio"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
