server.port=8086

spring.application.name=pago-service
spring.datasource.url=jdbc:h2:mem:gimnasiodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Reintentos del consumidor de pagos antes de enviar el mensaje a la Dead Letter Queue
pago.procesamiento.max-intentos=3
pago.procesamiento.intervalo-inicial-ms=1000
pago.procesamiento.multiplicador=2.0

# false = los mensajes fallidos se quedan en pagos.procesamiento.dlq (para verlos en http://localhost:15672)
pago.dlq.consumidor-activo=${PAGO_DLQ_CONSUMIDOR_ACTIVO:true}
