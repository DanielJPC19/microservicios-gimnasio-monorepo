server.port=8087

spring.application.name=monitoreo-service

# H2 en ARCHIVO (no en memoria): los checkpoints deben sobrevivir a un reinicio del servicio.
spring.datasource.url=${MONITOREO_DB_URL:jdbc:h2:file:./data/monitoreo-db}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update (no create-drop): conserva las tablas y los datos entre arranques.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Consumidor del dashboard (@KafkaListener, grupo monitoreo-grupo)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=co.analisys.gimnasio.dto.OcupacionClase
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=co.analisys.gimnasio.dto

# Kafka Streams (analisis de datos-entrenamiento)
spring.kafka.streams.application-id=monitoreo-streams
spring.kafka.streams.state-dir=${KAFKA_STREAMS_STATE_DIR:./data/kafka-streams}
spring.kafka.streams.replication-factor=1
spring.kafka.streams.properties.commit.interval.ms=1000

# Recuperacion ante fallos (consumidor con checkpoints en BD)
recuperacion.activo=${RECUPERACION_ACTIVO:true}
recuperacion.group-id=recuperacion-grupo

# Keycloak JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/gimnasio}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/gimnasio/protocol/openid-connect/certs}

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
