services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: gimnasio-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: gimnasio-keycloak
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  miembro-service:
    build: ./services/miembro-microservice
    ports:
      - "8083:8083"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/gimnasio
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/gimnasio/protocol/openid-connect/certs
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  entrenador-service:
    build: ./services/entrenador-microservice
    ports:
      - "8081:8081"
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/gimnasio
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/gimnasio/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy

  equipo-service:
    build: ./services/equipo-microservice
    ports:
      - "8082:8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/gimnasio
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/gimnasio/protocol/openid-connect/certs
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  clase-service:
    build: ./services/clase-microservice
    ports:
      - "8084:8084"
    environment:
      ENTRENADOR_SERVICE_URL: http://entrenador-service:8081
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/gimnasio
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/gimnasio/protocol/openid-connect/certs
    depends_on:
      entrenador-service:
        condition: service_started
      keycloak:
        condition: service_healthy

  notificacion-service:
    build: ./services/notificacion-microservice
    ports:
      - "8085:8085"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  pago-service:
    build: ./services/pago-microservice
    ports:
      - "8086:8086"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      PAGO_DLQ_CONSUMIDOR_ACTIVO: ${PAGO_DLQ_CONSUMIDOR_ACTIVO:-true}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/gimnasio
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/gimnasio/protocol/openid-connect/certs
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      ENTRENADOR_SERVICE_URL: http://entrenador-service:8081
      MIEMBRO_SERVICE_URL: http://miembro-service:8083
      EQUIPO_SERVICE_URL: http://equipo-service:8082
      CLASE_SERVICE_URL: http://clase-service:8084
      PAGO_SERVICE_URL: http://pago-service:8086
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/gimnasio
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/gimnasio/protocol/openid-connect/certs
    depends_on:
      entrenador-service:
        condition: service_started
      miembro-service:
        condition: service_started
      equipo-service:
        condition: service_started
      clase-service:
        condition: service_started
      notificacion-service:
        condition: service_started
      pago-service:
        condition: service_started
      keycloak:
        condition: service_healthy
